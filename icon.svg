<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Stylized Monogram GR with Star / Check -->
  <g transform="translate(76, 76)">
    <!-- Shield / Badge background glow -->
    <circle cx="180" cy="180" r="150" fill="#1e40af" fill-opacity="0.4" />
    
    <!-- Letter G & R integrated -->
    <!-- Calendar / CRM Box -->
    <rect x="50" y="50" width="260" height="260" rx="36" fill="none" stroke="url(#cyanGrad)" stroke-width="24" />
    <line x1="50" y1="120" x2="310" y2="120" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Calendar binder pins -->
    <rect x="100" y="26" width="28" height="48" rx="14" fill="#ffffff" />
    <rect x="232" y="26" width="28" height="48" rx="14" fill="#ffffff" />

    <!-- Sparkle / Check mark inside -->
    <path d="M110 215 L160 265 L250 170" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
